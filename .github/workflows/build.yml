name: AnarchyClient Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -q anarchyclient-elytratarget-source.zip -d extracted

      - name: Build JAR
        run: gradle -p extracted/anarchyclient build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnarchyClient-JAR
          path: extracted/anarchyclient/build/libs/*.jar
