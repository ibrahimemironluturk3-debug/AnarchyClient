name: AnarchyClient Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -q anarchyclient-elytratarget-source.zip -d extracted

      - name: Find project directory
        run: |
          PROJECT_DIR=$(find extracted -name build.gradle -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build JAR
        run: gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnarchyClient-JAR
          path: extracted/**/build/libs/*.jar
